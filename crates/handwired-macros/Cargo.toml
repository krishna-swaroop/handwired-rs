[package]
name = "handwired-macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "#[handwired::step]: translate a plain Rust function into handwired's Domain vocabulary."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
